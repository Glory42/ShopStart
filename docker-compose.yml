services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopstart
      POSTGRES_PASSWORD: shopstart
      POSTGRES_DB: shopstart
    ports:
      - "5432:5432"
    volumes:
      - shopstart-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopstart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopstart-postgres:
